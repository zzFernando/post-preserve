project:
  name: PostPreserve

identifiers:
  prefix: PP
  platform_codes:
    instagram: IG

capture:
  backend: browsertrix
  timeout_seconds: 180
  max_interactions: 30
  headed: false

package:
  checksum_algorithm: sha256
  output_format: zip

quality:
  require_wacz: true
  require_screenshot: true
  require_valid_metadata: true

